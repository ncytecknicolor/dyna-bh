name: Construir sitio para Bluehost
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Agregar los archivos del servidor
        run: |
          cp servidor/htaccess.txt out/.htaccess
          mkdir -p out/api
          cp servidor/contact.php out/api/contact.php
          cp servidor/config.ejemplo.php out/api/config.ejemplo.php
          cp servidor/api-htaccess.txt out/api/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: sitio-bluehost
          path: out
          include-hidden-files: true
